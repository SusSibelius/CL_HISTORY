<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Historiegissare – det dagliga historiespelet</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=15">
</head>
<body>
<div id="app">

  <div id="map"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-text">Historiegissare</span>
    </div>
    <div class="topbar-right">
      <div class="player-chip" id="playerChip" title="Ditt namn i dagens runda" hidden></div>
      <div class="streak" title="Antal rätt i rad">
        <span class="streak-num" id="streakNum">0</span>
        <span class="streak-label">i rad</span>
      </div>
    </div>
  </header>

  <main class="guess-capsule" id="guessCapsule">
    <p class="person-hint" id="personHint" hidden><span aria-hidden="true">💡</span> <span id="personHintText"></span></p>
    <form id="guessForm" autocomplete="off">
      <div class="guess-field">
        <input
          type="text"
          id="guessInput"
          placeholder="För- och efternamn"
          aria-describedby="feedback"
          autocomplete="off"
          spellcheck="false"
          disabled
        />
      </div>
      <button type="submit" class="guess-submit">Gissa</button>
    </form>
    <p class="feedback" id="feedback" aria-live="polite"></p>
  </main>

  <!-- Reviewing a finished run on the map, one person at a time. -->
  <section class="recap-panel" id="recapPanel" aria-live="polite" hidden></section>

  <div class="overlay" id="dailyOverlay" hidden>
    <div class="overlay-card" id="dailyCard" aria-live="polite"></div>
  </div>

</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="config.js?v=13"></script>
  <script src="match.js?v=15"></script>
  <script src="api.js?v=15"></script>
  <script src="game.js?v=15"></script>
</body>
</html>
