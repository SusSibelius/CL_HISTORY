<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Historiegissare — the daily history guessing game</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>

  <div id="map"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-text">Historiegissare</span>
    </div>
    <div class="topbar-right">
      <div class="player-chip" id="playerChip" title="Your name for today's run" hidden></div>
      <div class="streak" title="Current streak">
        <span class="streak-num" id="streakNum">0</span>
        <span class="streak-label">streak</span>
      </div>
    </div>
  </header>

  <div class="legend">
    <span class="legend-item"><i class="dot born"></i>Born</span>
    <span class="legend-item"><i class="dot died"></i>Died</span>
  </div>

  <main class="guess-capsule" id="guessCapsule">
    <form id="guessForm" autocomplete="off">
      <div class="guess-field">
        <input
          type="text"
          id="guessInput"
          placeholder="First and last name"
          aria-describedby="feedback"
          autocomplete="off"
          spellcheck="false"
          disabled
        />
      </div>
      <button class="hint-btn" id="lifelineBtn" type="button" title="Hint (one per run)" aria-label="Use hint (one per run)">💡</button>
      <button type="submit" class="guess-submit">Guess</button>
    </form>
    <p class="feedback" id="feedback" aria-live="polite"></p>
  </main>

  <div class="overlay" id="dailyOverlay" hidden>
    <div class="overlay-card" id="dailyCard" aria-live="polite"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="config.js?v=5"></script>
  <script src="match.js?v=9"></script>
  <script src="api.js?v=9"></script>
  <script src="game.js?v=9"></script>
</body>
</html>
